[project]
name = "merton-dd"
version = "0.1.0"
description = "Réplica y extensión de Bharath & Shumway (2008): Merton Distance to Default con datos públicos de EE.UU."
requires-python = ">=3.12"
dependencies = [
    "kaleido>=1.3.0",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.58.0",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
